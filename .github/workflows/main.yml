name: Push File

on:
  push:
    branches:
      - main
jobs:
  copy-file:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        sparse-checkout: |
          markdown
        sparse-checkout-cone-mode: false
    
    - name: Pushes test folder
      uses: datalbry/copy_folder_to_another_repo_action@1.0.0
      env:
        API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
      with:
        source_folder: 'markdown'
        destination_repo: 'Eurac-Research/ADO'
        destination_folder: '_posts/markdown'
        destination_branch: 'main'
        user_email: 'thomas.iacopino@eurac.edu'
        user_name: 'tiacopino'
        commit_msg: '[GHA] Update the files.'
  
  feature-extraction:
    runs-on: ubuntu-latest
    needs: copy-file
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        filter: blob:none
        sparse-checkout: |
          json/nuts/*.geojson
          json/nuts/*-latest-features.json
          json/nuts/*.min.geojson
        sparse-checkout-cone-mode: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Extract features from latest.geojson files
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');
        
        // Process geojson files in json/nuts directory
        const nutsDir = 'json/nuts';
        if (!fs.existsSync(nutsDir)) {
          console.log('json/nuts directory does not exist');
          process.exit(0);
        }
        
        // Find all XXX-latest.geojson files
        const files = fs.readdirSync(nutsDir).filter(file => file.endsWith('-latest.geojson'));
        
        if (files.length === 0) {
          console.log('No *-latest.geojson files found in json/nuts directory');
          process.exit(0);
        }
        
        console.log(\`Found \${files.length} *-latest.geojson files to process\`);
        
        files.forEach(file => {
          const filePath = path.join(nutsDir, file);
          console.log(\`Processing: \${file}\`);
          
          try {
            const geojsonData = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            
            // Extract only properties from features (no geometry)
            if (geojsonData.features && Array.isArray(geojsonData.features)) {
              const propertiesOnly = geojsonData.features.map(feature => {
                if (feature.properties) {
                  return feature.properties;
                }
                return null;
              }).filter(props => props !== null);
              
              // Create output filename: XXX-latest.geojson -> XXX-latest-features.json
              const baseName = path.basename(file, '.geojson');
              const outputFile = path.join(nutsDir, \`\${baseName}-features.json\`);
              
              // Write minified JSON (no spaces, no indentation)
              fs.writeFileSync(outputFile, JSON.stringify(propertiesOnly));
              
              console.log(\`Created: \${outputFile} with \${propertiesOnly.length} feature properties (minified, no geometry)\`);
              
              // Also create a minified version of the original geojson
              const minifiedGeojsonFile = path.join(nutsDir, \`\${baseName}.min.geojson\`);
              
              // Round coordinates to reduce precision (6 decimal places is usually sufficient)
              const minifiedGeojson = {
                ...geojsonData,
                features: geojsonData.features.map(feature => ({
                  ...feature,
                  geometry: feature.geometry ? {
                    ...feature.geometry,
                    coordinates: roundCoordinates(feature.geometry.coordinates, 6)
                  } : feature.geometry
                }))
              };
              
              fs.writeFileSync(minifiedGeojsonFile, JSON.stringify(minifiedGeojson));
              console.log(\`Created: \${minifiedGeojsonFile} (minified geojson)\`);
            } else {
              console.log(\`No features array found in \${file}\`);
            }
          } catch (error) {
            console.error(\`Error processing \${file}: \${error.message}\`);
          }
        });
        
        // Helper function to round coordinates
        function roundCoordinates(coords, precision) {
          if (Array.isArray(coords)) {
            return coords.map(coord => roundCoordinates(coord, precision));
          }
          return Math.round(coords * Math.pow(10, precision)) / Math.pow(10, precision);
        }
        
        console.log('Feature extraction completed successfully');
        "
    
    - name: Commit and push extracted features
      run: |
        git config --local user.email "thomas.iacopino@eurac.edu"
        git config --local user.name "tiacopino"
        git add --sparse json/nuts/*-latest-features.json
        git add --sparse json/nuts/*.min.geojson
        git diff --staged --quiet || git commit -m "[GHA] Update minified features and geojson files"
        git push
  
  deployment:
    runs-on: ubuntu-latest
    needs: feature-extraction
    steps:
    - name: Deploy to production on vercel
      uses: fjogeleit/http-request-action@master
      with:
        url: ${{secrets.TRIGGERVERCELBUILD}}
        method: 'POST'
