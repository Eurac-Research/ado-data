name: Process High-Resolution TIFFs

on:
  push:
    paths:
      - 'tiffs/raw/**/*.tif'
      - 'json/nuts/metadata/*.json'
  workflow_dispatch:

jobs:
  process-tiffs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tiffs/raw
            tiffs/colormaps
            tiffs/optimized
            json/nuts/metadata
            scripts
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal
          gdalinfo --version
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Generate GDAL colormaps
        run: |
          echo "Generating GDAL colormap files..."
          mkdir -p tiffs/colormaps
          
          for metadata in json/nuts/metadata/*.json; do
            if [ ! -f "$metadata" ]; then continue; fi
            node scripts/convert-metadata-to-gdal-colormap.js "$metadata" tiffs/colormaps
          done
          
          ls -lh tiffs/colormaps/
      
      - name: Process TIFFs
        run: |
          echo "Processing TIFF files..."
          processed_count=0
          
          for raw_tiff in tiffs/raw/**/**/*.tif; do
            if [ ! -f "$raw_tiff" ]; then continue; fi
            
            echo "Processing: $raw_tiff"
            
            index=$(echo "$raw_tiff" | cut -d'/' -f3)
            year=$(echo "$raw_tiff" | cut -d'/' -f4)
            filename=$(basename "$raw_tiff")
            doy=$(echo "$filename" | grep -oP 'doy\d{4}\K\d{3}' || echo "001")
            week=$((10#$doy / 8 + 1))
            
            colormap="tiffs/colormaps/${index}-colormap.txt"
            if [ ! -f "$colormap" ]; then
              echo "Colormap not found: $colormap"
              continue
            fi
            
            output_dir="tiffs/optimized/${index}/${year}"
            mkdir -p "$output_dir"
            
            colored_tiff="${output_dir}/week-${week}-colored.tif"
            optimized_tiff="${output_dir}/week-${week}.tif"
            optimized_png="${output_dir}/week-${week}.png"
            
            if [ -f "$optimized_tiff" ] && [ -f "$optimized_png" ]; then
              echo "Already processed, skipping..."
              continue
            fi
            
            echo "Step 1/3: Colorizing..."
            gdaldem color-relief "$raw_tiff" "$colormap" "$colored_tiff" \
              -alpha \
              -co COMPRESS=LZW \
              -co PREDICTOR=2 \
              -co TILED=YES \
              -co COPY_SRC_OVERVIEWS=YES
            
            # Verify georeferencing is preserved
            echo "Checking georeferencing..."
            gdalinfo "$colored_tiff" | grep -E "Upper Left|Lower Right|Pixel Size"
            
            echo "Step 2/3: Creating optimized JPEG (primary web format)..."
            # Use JPEG for much smaller file sizes (5-10x smaller than PNG)
            # QUALITY=85 provides good balance of quality and file size
            jpeg_file="${optimized_png%.png}.jpg"
            gdal_translate -of JPEG \
              -co QUALITY=85 \
              -co WORLDFILE=YES \
              "$colored_tiff" "$jpeg_file"
            
            echo "Step 3/3: Creating COG (for GIS/download)..."
            gdal_translate -of COG \
              -co COMPRESS=JPEG \
              -co QUALITY=75 \
              -co PHOTOMETRIC=YCBCR \
              -co NUM_THREADS=ALL_CPUS \
              -co BLOCKSIZE=512 \
              "$colored_tiff" "$optimized_tiff"
            
            rm -f "$colored_tiff"
            
            original_size=$(du -h "$raw_tiff" | cut -f1)
            optimized_size=$(du -h "$optimized_tiff" | cut -f1)
            echo "Original: $original_size -> Optimized: $optimized_size"
            
            processed_count=$((processed_count + 1))
          done
          
          echo "Processed $processed_count TIFF(s)"
      
      - name: Commit processed files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tiffs/optimized/ tiffs/colormaps/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Process high-resolution TIFFs [skip ci]"
          git push
